<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Bezier Curves</title>
    </head>
    <body>
        <div class="container">
            <h1>Bezier Curves</h1>
        </div>
        <svg viewBox="180 80 400 200">
          <path d="M 200 100 C 350 100, 350 200, 500 200" fill="none" stroke="black" stroke-width="2"/>
          <circle cx="200" cy="100" r="5" fill="darkgray"/>
          <line x1="200" y1="100" x2="350" y2="100" stroke="darkgray" stroke-width="2"/>
          <circle cx="350" cy="100" r="5" fill="darkgray"/>
          <circle cx="350" cy="200" r="5" fill="darkgray"/>
          <line x1="350" y1="200" x2="500" y2="200" stroke="darkgray" stroke-width="2"/>
          <circle cx="500" cy="200" r="5" fill="darkgray"/>
        </svg>
    </body>
</html>

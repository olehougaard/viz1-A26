<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Bezier Curves</title>
    </head>
    <body>
        <div class="container">
            <h1>Bezier Curves</h1>
        </div>
        <svg width="800" height="600">
          <path d="M 200 400 C 300 200, 400 200, 500 400" fill="none" stroke="black" stroke-width="2"/>
          <circle cx="200" cy="400" r="5" fill="darkgray"/>
          <line x1="200" y1="400" x2="300" y2="200" stroke="darkgray" stroke-width="2"/>
          <circle cx="300" cy="200" r="5" fill="darkgray"/>
          <circle cx="400" cy="200" r="5" fill="darkgray"/>
          <line x1="400" y1="200" x2="500" y2="400" stroke="darkgray" stroke-width="2"/>
          <circle cx="500" cy="400" r="5" fill="darkgray"/>
        </svg>
    </body>
</html>

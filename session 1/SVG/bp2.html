<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Simple Blood Pressure Diagram</title>
    </head>
    <body>
        <h1>Simple Blood Pressure Diagram</h1>

        <svg width="800" height="600">
          <line x1="100" y1="500" x2="700" y2="500" stroke="black" stroke-width="2"/>
          <path d="M 90 110 l 10 -10 l 10 10" fill="none" stroke="black" stroke-width="2"/>
          <text x="590" y="525" font-size="16">Systolic Pressure</text>

          <line x1="100" y1="500" x2="100" y2="100" stroke="black" stroke-width="2"/>
          <path d="M 690 490 l 10 10 l -10 10" fill="none" stroke="black" stroke-width="2"/>
          <text x="120" y="105" font-size="16">Diastolic Pressure</text>
                    
          <line x1="90" y1="420" x2="110" y2="420" stroke="black" stroke-width="2"/>
          <text x="120" y="425" font-size="16">70</text>
          <line x1="90" y1="340" x2="110" y2="340" stroke="black" stroke-width="2"/>
          <text x="120" y="345" font-size="16">80</text>
          <line x1="90" y1="260" x2="110" y2="260" stroke="black" stroke-width="2"/>
          <text x="120" y="265" font-size="16">90</text>
          <line x1="90" y1="180" x2="110" y2="180" stroke="black" stroke-width="2"/>
          <text x="120" y="185" font-size="16">100</text>

          <line x1="180" y1="490" x2="180" y2="510" stroke="black" stroke-width="2"/>
          <text x="173" y="480" font-size="16">100</text>
          <line x1="260" y1="490" x2="260" y2="510" stroke="black" stroke-width="2"/>
          <text x="253" y="480" font-size="16">110</text>
          <line x1="340" y1="490" x2="340" y2="510" stroke="black" stroke-width="2"/>
          <text x="333" y="480" font-size="16">120</text>
          <line x1="420" y1="490" x2="420" y2="510" stroke="black" stroke-width="2"/>
          <text x="413" y="480" font-size="16">130</text>
          <line x1="500" y1="490" x2="500" y2="510" stroke="black" stroke-width="2"/>
          <text x="493" y="480" font-size="16">140</text>
          <line x1="580" y1="490" x2="580" y2="510" stroke="black" stroke-width="2"/>
          <text x="573" y="480" font-size="16">150</text>

          <circle cx="520" cy="300" r="40" fill="none" stroke="black" stroke-width="2"/>
          <text x="568" y="307" font-size="16">0</text>
          <circle cx="540" cy="220" r="20" fill="none" stroke="black" stroke-width="2"/>
          <text x="570" y="227" font-size="16">1</text>
          <circle cx="420" cy="280" r="12" fill="none" stroke="black" stroke-width="2"/>
          <text x="444" y="287" font-size="16">2</text>
          <circle cx="340" cy="340" r="8" fill="none" stroke="black" stroke-width="2"/>
          <text x="360" y="347" font-size="16">3</text>
        </svg>  
    </body>
</html>

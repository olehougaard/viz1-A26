<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Age Visualizations</title>
        
        <link rel="stylesheet" href="./css/styles.css">

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="./js/main.js"></script>
    </head>
    <body onload="init()">
        <h1>Age Visualizations</h1>
        <h2>Warning: Biased Data</h2>

        <div id = "container">
        </div>

        <div>
          <input id = "vis1" type="radio" name="visualization" value="ageGroupByRegion" onclick="visualizeAgeGroupByRegion()" checked> Age Group By Region
          <input id = "vis2" type="radio" name="visualization" value="ageGroupByYear" onclick="visualizeAgeGroupByYear()">Age Group By Year 
          <input id = "vis3" type="radio" name="visualization" value="bloodPressureByCountry" onclick="visualizeAgeGroupByYearStreamGraph()">Age Group By Year on Stream Graph
          <input id = "vis4" type="radio" name="visualization" value="bloodPressureByCountryAndGender" onclick="visualizeAgeGroupByYearStreamGraphCentered()"> Age Group By Year on Centered Stream Graph
        </div>
    </body>
</html>
